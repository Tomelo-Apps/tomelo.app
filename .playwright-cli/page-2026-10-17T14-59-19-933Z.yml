      - heading "První spuštění" [level=2] [ref=e71]
      - paragraph [ref=e72]: "Při prvním otevření vás krátký průvodce požádá o několik oprávnění. Každé z nich slouží jedinému účelu — aby připomínka opravdu zazvonila. PillBell nemá přístup k internetu a nic o vás nesbírá:"
      - list [ref=e73]:
        - listitem [ref=e74]: Notifikace — bez nich se žádná připomínka nemůže ukázat.
        - listitem [ref=e75]: Budíky a připomínky — aby PillBell zazvonil přesně na minutu.
        - listitem [ref=e76]: Zobrazení na celou obrazovku — budík může rozsvítit celý displej jako klasický budík.
        - listitem [ref=e77]: Baterie / běh na pozadí — aby telefon aplikaci neuspal. Průvodce ukáže kroky přesně pro vaši značku telefonu (Samsung, Xiaomi a další se liší).
        - listitem [ref=e78]: Přístup k režimu Nerušit — připomínka projde i přes zapnuté Nerušit.
        - listitem [ref=e79]: Widget na plochu — poslední krok nabídne přidání widgetu PillBell na plochu; dá se přeskočit a přidat později.
      - generic [ref=e80]: "Na konci si zkuste zkušební připomínku: zamkněte telefon, počkejte dvě minuty a sledujte, jak budík probudí displej a zvoní. Přesně tak se zachová i ostrá připomínka."
      - generic [ref=e81]: Nikdy aplikaci „násilně neukončujte“ (Force stop) v nastavení Androidu. Násilně ukončená aplikace nesmí zvonit, dokud ji znovu ručně neotevřete.
      - heading "Přidání léku" [level=2] [ref=e82]
      - img "Přidání léku" [ref=e84]
      - paragraph [ref=e85]: Jděte na Léky → Přidat lék. Průvodce ve čtyřech krocích se zeptá na název, formu a sílu, rozvrh, množství na dávku a ukáže shrnutí. Můžete přidat i fotku balení, ať vždy víte, co hledat.
      - paragraph [ref=e86]: "PillBell zvládá všechny běžné rozvrhy: pevné časy během dne (bez omezení počtu), několikrát denně, po N hodinách, po N dnech, vybrané dny v týdnu, cykly typu 21/7, týdenní i měsíční léky, obden i poloviční a proměnné dávky („1 až 2 tablety“)."
      - img "Přidání léku" [ref=e88]
      - heading "Obrazovka Dnes" [level=2] [ref=e89]
      - img "Obrazovka Dnes" [ref=e91]
      - paragraph [ref=e92]: "Dnes funguje jako denní dávkovač léků: čtyři přihrádky — Noc, Ráno, Poledne, Večer. Zelená ✓ znamená vysypáno; ikonky pilulek ukazují, co ještě čeká."
      - list [ref=e93]:
        - listitem [ref=e94]: Vidíte celý den najednou, rozdělený na Noc, Ráno, Poledne a Večer. Klepnutí na přihrádku seznam posune na tu část dne.
        - listitem [ref=e95]: "Klepnutím na dávku ji potvrdíte nebo opravíte: Vzato, Vzato v jiný čas, Vynecháno, nebo zpět na Nevzato."
        - listitem [ref=e96]: Dávku lze potvrdit kdykoli během dne. Vzetí o víc než 30 minut dřív se poctivě zapíše jako „Vzato dřív“.
      - img "Obrazovka Dnes" [ref=e98]
      - paragraph [ref=e99]: "Záložka Plán ukazuje celý týden jako dávkovač: sloupce jsou dny, řádky části dne. Zelená ✓ znamená vysypáno, číslo kolik léků čeká, nula že tehdy nic neberete. Klepnutím na den se dole rozbalí jeho rozpis, přejetím do strany přejdete na další týden."
      - heading "Když zvoní" [level=2] [ref=e100]
      - img "Když zvoní" [ref=e102]
      - paragraph [ref=e103]: V naplánovanou minutu PillBell zvoní jako budík — na celou obrazovku, i ze zamčeného telefonu, a zvoní, dokud nezareagujete. Projde i přes režim Nerušit.
      - list [ref=e104]:
        - listitem [ref=e105]: ✓ Vzato — potvrdí dávku a budík ztichne.
        - listitem [ref=e106]: Připomenout za 15 minut — odloží; aplikace pak všude ukazuje „Odloženo do HH:MM“.
        - listitem [ref=e107]: Vynechat — zapíše dávku jako vědomě vynechanou.
      - paragraph [ref=e108]: Když nikdo nereaguje, připomínka se po chvíli sama zopakuje. Na zamčené obrazovce se názvy léků standardně neukazují (soukromí) — v Nastavení je můžete povolit, pokud bydlíte sami.
      - heading "Jednoduchý režim" [level=2] [ref=e109]
      - img "Jednoduchý režim" [ref=e111]
      - paragraph [ref=e112]: "Pro každého, komu telefony nejsou vlastní: Nastavení → Zobrazení → Zjednodušené. Celá aplikace se změní v jednu velkou kartu — co si vzít jako další a jedno velké tlačítko „Vzal(a) jsem si“. Zpět se vrátíte posuvníkem „Plné zobrazení“ dole."
      - heading "Rodinné profily" [level=2] [ref=e113]
      - img "Rodinné profily" [ref=e115]
      - paragraph [ref=e116]: "Jeden telefon může připomínat celé domácnosti. Osoby přidáte v Nastavení → Osoby. Mezi lidmi přepínáte tlačítkem se jménem vpravo nahoře na Dnes — ukazuje i, kdo má ještě dávky před sebou. Připomínky říkají, komu patří („Anna: 2 léky“)."
      - heading "Widgety" [level=2] [ref=e117]
      - img "Widgety" [ref=e119]
      - paragraph [ref=e120]: "Podržte prst na prázdné ploše → Widgety → PillBell. Jsou dva druhy, každý ve světlé i tmavé verzi:"
      - list [ref=e121]:
        - listitem [ref=e122]: "Dnešní přehled — celá domácnost: postup dne, nejbližší čas a léky, které jsou na řadě."
        - listitem [ref=e123]: "Widget na osobu (malý) — při přidání si vyberete, čí léky má ukazovat. Dva vedle sebe: „Anna“ a „Tomáš“."
      - paragraph [ref=e124]: "Od verze 1.0.1 má widget prstenec: ukazuje, kolik dnešních dávek je vzato (třeba 4/6). Zelený prstenec s fajfkou = pro dnešek hotovo, červený = prošlá dávka. Když má dnes dávky jen jedna osoba, zabere velký prstenec celý widget."
      - heading "Historie a PDF pro lékaře" [level=2] [ref=e125]
      - img "Historie a PDF pro lékaře" [ref=e127]
      - paragraph [ref=e128]: Záložka Historie uchovává posledních 30 dní. Jedním klepnutím vytvoříte PDF seznam léků pro lékaře — léky, dávky a jak pravidelně jste je brali. Vše jde exportovat i jako CSV a starší záznamy lze opravit.
      - heading "Lékárnička a zásoby" [level=2] [ref=e129]
      - img "Lékárnička a zásoby" [ref=e131]
      - paragraph [ref=e132]: "Léky „podle potřeby“ (na bolest, kapky…) žijí v lékárničce — nemají rozvrh, zapíšete je, když si je vezmete. U pravidelných léků můžete sledovat zásoby: PillBell odpočítává a včas upozorní, že docházejí."
      - heading "Zálohy — důležité" [level=2] [ref=e133]
      - img "Zálohy — důležité" [ref=e135]
      - generic [ref=e136]: "PillBell je plně offline. Chrání to vaše soukromí, ale znamená to také: když o telefon přijdete, přijdete i o data — pokud nemáte záložní soubor."
      - paragraph [ref=e137]: "Jděte do Nastavení → Záloha a exportujte zálohu (jediný soubor včetně fotek léků). Uložte ji kam chcete — pošlete si ji e-mailem, dejte do cloudu, zkopírujte do počítače. Přechod na nový telefon: nainstalovat PillBell, obnovit zálohu, hotovo — všechny připomínky se samy znovu nastaví. PillBell zálohu jemně připomene zhruba jednou měsíčně."
      - heading "Aby připomínky spolehlivě chodily" [level=2] [ref=e138]
      - img "Aby připomínky spolehlivě chodily" [ref=e140]
      - list [ref=e141]:
        - listitem [ref=e142]: Dokončete krok s baterií v průvodci (najdete ho i v Nastavení). Výrobci telefonů rádi uspávají aplikace kvůli baterii — to je nejčastější důvod, proč připomínače „ztichnou“.
        - listitem [ref=e143]: Nikdy aplikaci násilně neukončujte.
        - listitem [ref=e144]: "Samsung: držte PillBell mimo „Spící aplikace“. Xiaomi: povolte „Autostart“. Aplikace vás na správnou obrazovku navede."
        - listitem [ref=e145]: Sledujte Nastavení → Spolehlivost — PillBell zaznamenává každý budík a poctivě ukazuje, kolik jich za posledních 30 dní zazvonilo včas.
      - heading "Časté dotazy" [level=2] [ref=e146]
      - paragraph [ref=e147]: Připomínka nezazvonila. Co teď? Otevřete Nastavení → Spolehlivost a průvodce baterií. V 9 z 10 případů aplikaci umlčel spořič baterie — průvodce to napraví. Ověřte také, že aplikace nebyla násilně ukončena.
      - paragraph [ref=e148]: Funguje to s režimem Nerušit? Ano, pokud jste při nastavení udělili přístup k Nerušit.
      - paragraph [ref=e149]: Co cestování a časová pásma? Rozvrh zůstává ukotvený k domácímu času — odstupy dávek se přeletem nikdy neposunou.
      - paragraph [ref=e150]: Můžu aplikaci zamknout? Ano — Nastavení → Zámek aplikace (otisk/PIN). Zvonící budík a „Vzato“ fungují vždy i bez odemykání.
      - paragraph [ref=e151]: Jaké jazyky? Aplikace umí česky, anglicky, německy, francouzsky, španělsky, italsky, polsky, nizozemsky, portugalsky a ukrajinsky.
      - paragraph [ref=e152]: Něco mi chybí nebo nefunguje — jak dám vědět? Nastavení → Líbí se vám PillBell? → Napsat vývojáři. Otevře se e-mail s doplněnou verzí aplikace a typem telefonu (nic o lécích). Tamtéž najdete Ohodnotit v Google Play a Doporučit známému.
