<footer class="site-foot">
  <div class="wrap foot-main">
    <div class="foot-brand">
      <a class="brand" href="{{p}}/" aria-label="{{home_label}}">
        <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="logo-on" cx="20" cy="20" r="13"/><circle class="logo-on" cx="50" cy="20" r="13"/><circle class="logo-on" cx="80" cy="20" r="13"/><circle class="logo-off" cx="20" cy="50" r="13"/><circle class="logo-on" cx="50" cy="50" r="13"/><circle class="logo-off" cx="80" cy="50" r="13"/><circle class="logo-off" cx="20" cy="80" r="13"/><circle class="logo-on" cx="50" cy="80" r="13"/><circle class="logo-sun" cx="80" cy="80" r="13"/></svg>
        <span>Tomelo</span>
      </a>
      <p class="note">{{note}}</p>
    </div>
    <nav class="foot-links" aria-label="Tomelo">
      <a href="{{p}}/pillbell/">PillBell</a>
      <a href="{{p}}/help/">{{help_centre}}</a>
      <a href="{{guide_href}}">{{pillbell_guide}}</a>
      <a href="{{p}}/contact/">{{contact}}</a>
      <a href="/legal/" hreflang="en">{{legal}}</a>
      <a href="/privacy/" hreflang="en">{{web_privacy}}</a>
      <a href="/pillbell/privacy/" hreflang="en">{{pb_privacy}}</a>
    </nav>
  </div>
  {{langs}}
</footer>
<script>document.addEventListener("click",function(e){document.querySelectorAll("details.lang-menu[open]").forEach(function(d){if(!d.contains(e.target))d.removeAttribute("open")})});document.addEventListener("keydown",function(e){if(e.key==="Escape")document.querySelectorAll("details.lang-menu[open]").forEach(function(d){d.removeAttribute("open");d.querySelector("summary").focus()})});</script>
